<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Poem Generator</h1>
      </header>

      <main>
        <form action="">
          <input
            type="text"
            placeholder="Enter the topic of the poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem">
          The poem will go here
          <br />
          This is another placeholder
        </div>
      </main>

      <footer>
        This AI project was coded by
        <a href="https://www.linkedin.com/in/brenda-ecd/" target="_blank"
          >Brenda Cadena</a
        >
        and is
        <a href="https://github.com/brndcdn/poem-generator" target="_blank"
          >open-sourced on GitHub</a
        >
        and is hosted on
        <a href="https://www.netlify.com/" target="_blank">Netlify</a>.
      </footer>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
